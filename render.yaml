# Paid managed hosting; creating this Blueprint starts billable resources.
# First create the private environment group described in faucet/RENDER.md.
previews:
  generation: "off"
services:
  - type: web
    name: neta-junox-faucet
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: .
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --prefix faucet --omit=dev --ignore-scripts && npm ci --prefix relay-backup --omit=dev --ignore-scripts
    startCommand: 'FAUCET_PUBLIC_ORIGIN="${FAUCET_PUBLIC_ORIGIN:-$RENDER_EXTERNAL_URL}" node faucet/service/server.mjs'
    # Default TCP health checks avoid polling the chain or claim ledger.
    disk:
      name: faucet-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: neta-junox-faucet-private
      - key: NODE_VERSION
        value: 24.19.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: FAUCET_DB
        value: /var/data/faucet.sqlite
      - key: FAUCET_MNEMONIC_FILE
        value: /etc/secrets/faucet-mnemonic
      - key: FAUCET_WEB_ORIGIN
        value: https://dao.netareborn.com
      - key: FAUCET_RPC
        value: https://juno.test.rpc.nodeshub.online
      # Enable only with a verified mailbox and consenting pilot allowlist.
      # Existing disk, faucet secret and payout ledger stay in place.
      - key: RELAY_BACKUP_ENABLED
        value: "false"
      - key: RELAY_BACKUP_DIRECTORY
        value: /var/data/relay-backup
      - key: RELAY_WEB_ORIGIN
        value: https://dao.netareborn.com
