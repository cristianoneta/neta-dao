[package]
name = "neta-proposal-workshop"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-schema = "1.5.11"
cosmwasm-std = { version = "1.5.11", features = ["staking"] }
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
schemars = "0.8.22"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"
serde_json = "1.0"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true
