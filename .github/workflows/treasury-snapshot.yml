name: Treasury snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Collect verified treasury state
        env:
          TREASURY_DAILY_SNAPSHOT: auto
        run: python scripts/update_treasury.py
      - name: Collect transaction-backed Operations events
        run: python scripts/update_treasury_events.py
      - name: Commit changed snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/treasury/current.json data/treasury/history.json data/treasury/juno-community-pool.json data/treasury/juno-community-history.json data/treasury/events.json
          git diff --cached --quiet || git commit -m "Update treasury snapshot"
          git push
