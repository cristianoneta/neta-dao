name: Treasury snapshot

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_delegation_treasury.py"
      - "scripts/update_treasury.py"
      - "scripts/update_treasury_events.py"
      - "scripts/treasury_history.py"
      - "scripts/update_generic_accounting.py"
      - "scripts/update_community_accounting.py"
      - "scripts/update_dao_directory.py"
      - "data/dao-directory.json"
      - "data/treasury/token-registry.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Collect verified treasury state
        continue-on-error: true
        env:
          TREASURY_DAILY_SNAPSHOT: auto
        run: python scripts/update_treasury.py
      - name: Collect Operations and native Community Pool accounting independently
        run: python scripts/update_generic_accounting.py --collect
      - name: Collect Delegation Programme holdings and receipts
        continue-on-error: true
        env:
          TREASURY_DAILY_SNAPSHOT: auto
        run: python scripts/update_delegation_treasury.py
      - name: Commit changed snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/treasury/juno-delegation*.json data/treasury/current.json data/treasury/history.json data/treasury/juno-community-pool.json data/treasury/juno-community-history.json data/treasury/events.json data/treasury/neta-operations-accounting.json data/treasury/juno-community-events.json data/treasury/juno-community-accounting.json
          if git diff --cached --quiet; then
            echo "No treasury changes to publish."
            exit 0
          fi
          git commit -m "Update treasury snapshot"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Treasury push failed after three attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
            git fetch origin main
            git rebase -X theirs origin/main
          done

