name: Treasury snapshot

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_delegation_treasury.py"
      - "scripts/update_treasury.py"
      - "scripts/update_treasury_events.py"
      - "scripts/treasury_history.py"
      - "scripts/update_generic_accounting.py"
      - "scripts/update_community_accounting.py"
      - "scripts/community_block_ledger.py"
      - "scripts/community_statement.py"
      - "scripts/community_cash_review.py"
      - "scripts/staking_accrual.py"
      - "scripts/update_dao_directory.py"
      - "data/dao-directory.json"
      - "data/treasury/token-registry.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install block collector HTTP client
        run: python -m pip install -r scripts/requirements-community.txt
      - name: Collect verified treasury state
        continue-on-error: true
        env:
          TREASURY_DAILY_SNAPSHOT: auto
        run: python scripts/update_treasury.py
      - name: Continue native Community Pool block allocations
        timeout-minutes: 5
        # Allocation scan checkpoints are collector-owned; subsequent runs resume.
        # A failed scan retains the last proven contiguous range.
        run: python scripts/community_block_ledger.py --seconds 180
        continue-on-error: true
      - name: Build receipt and Community Pool statements
        run: python scripts/update_generic_accounting.py --collect
      - name: Collect Delegation Programme holdings and receipts
        timeout-minutes: 5
        continue-on-error: true
        env:
          TREASURY_DAILY_SNAPSHOT: auto
        run: python scripts/update_delegation_treasury.py
      - name: Commit changed snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/treasury/juno-delegation*.json data/treasury/current.json data/treasury/history.json data/treasury/juno-community*.json data/treasury/juno-community-blocks.json.gz data/treasury/events.json data/treasury/neta-operations-accounting.json
          if git diff --cached --quiet; then
            echo "No treasury changes to publish."
            exit 0
          fi
          git commit -m "Update treasury snapshot"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Treasury push failed after three attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
            git fetch origin main
            git rebase -X theirs origin/main
          done
