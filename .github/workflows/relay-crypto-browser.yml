name: RELAY browser crypto smoke

on:
  pull_request:
    paths:
      - '.github/workflows/relay-crypto-browser.yml'
      - 'spikes/relay-corecrypto/**'
      - 'relay-uni7-*.mjs'
      - 'relay-personal-*.mjs'
      - 'relay-personal-*.html'
      - 'juno-consensus-*.mjs'
      - 'juno-upgrade-status.*'
      - 'juno-upgrade-history.mjs'
      - 'juno-upgrade-readiness.mjs'
      - 'data/validator-upgrades/*-readiness.json'
      - 'community-tools/**'
      - 'community-tools*.css'
      - 'community-*.mjs'
      - 'data/community-upgrades.json'
      - 'relay-uni7-lab.html'
      - 'relay-uni7-lab.css'
      - 'assets/relay-crypto/**'
      - 'relay.js'
      - 'relay-dao-*.mjs'
      - 'relay-dao-inbox.css'
      - 'treasury.js'
      - 'treasury-*.mjs'
      - 'nns-transactions.mjs'
      - 'nns-transactions.html'
      - 'proposal-accounting.mjs'
      - 'neta-governance.js'
      - 'names.js'
      - 'names-workspace.js'
      - 'names-profile*.mjs'
      - 'names-v2*.mjs'
      - 'names/**'
      - 'names-mainnet-*.html'
      - 'names-mainnet-*.css'
      - 'names-v2*.html'
      - 'assets/names-signing.js'
      - 'assets/names-testnet/**'
      - 'tests/fixtures/nns-v2-quote.json'
      - 'dao-directory.js'
      - 'dao-hierarchy.mjs'
      - 'dao-structure.mjs'
      - 'dao-members.js'
      - 'data/dao-directory.json'
      - 'index.html'
      - "*.css"
      - "assets/design/**"
      - "docs/design/responsive-preview.html"
      - "ux-draft.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/relay-corecrypto
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spikes/relay-corecrypto/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:transport
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node browser-uni7-lab.mjs
      - run: node browser-personal-deploy.mjs
      - run: node browser-juno-consensus.mjs
      - run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/dao-inbox-screenshots" node browser-dao-inbox.mjs
      - run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-dao-hierarchy.mjs
      - run: node browser-workspace-security.mjs
      - run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-treasury-pnl.mjs
      - run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-community-accounting.mjs
      - run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-names-profile.mjs
      - run: node browser-names-v2.mjs
      - run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-names-workspace.mjs
      - run: NNS_MAINNET=1 NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-names-workspace.mjs
      - run: NNS_MAINNET=1 NNS_ADMIN=1 NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-names-workspace.mjs
      - run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-names-mainnet-setup.mjs
      - run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-names-mainnet-deploy.mjs
      - name: Validator proof browser flow
        run: NNS_SCREENSHOT_DIR="$RUNNER_TEMP/nns-validator-screenshots" node browser-names-validators.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nns-validator-screenshots
          path: ${{ runner.temp }}/nns-validator-screenshots
          if-no-files-found: error
      - name: Adversarial receive and crash recovery regressions
        run: RELAY_AUDIT_ADVERSARIAL=1 node browser-uni7-lab.mjs
