name: RELAY browser crypto smoke

on:
  pull_request:
    paths:
      - '.github/workflows/relay-crypto-browser.yml'
      - 'spikes/relay-corecrypto/**'
      - 'relay-uni7-*.mjs'
      - 'relay-uni7-lab.html'
      - 'relay-uni7-lab.css'
      - 'assets/relay-crypto/**'
      - 'treasury.js'
      - 'neta-governance.js'
      - 'names.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/relay-corecrypto
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spikes/relay-corecrypto/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:transport
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node browser-uni7-lab.mjs
      - run: node browser-workspace-security.mjs
      - name: Reproduce known UNI-7 availability blocker locally
        run: RELAY_AUDIT_ADVERSARIAL=1 node browser-uni7-lab.mjs
