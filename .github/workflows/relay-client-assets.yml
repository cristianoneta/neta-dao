name: Prepare pinned RELAY browser runtime

on:
  push:
    branches:
      - integration/relay-uni7-live-client-20260927
    paths:
      - '.github/workflows/relay-client-assets.yml'
      - 'spikes/relay-corecrypto/package-lock.json'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/relay-uni7-live-client-20260927
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spikes/relay-corecrypto/package-lock.json
      - run: npm ci --prefix spikes/relay-corecrypto
      - name: Copy pinned browser runtime and license
        run: |
          set -eu
          package=spikes/relay-corecrypto/node_modules/@wireapp/core-crypto
          test -f "$package/dist/browser/corecrypto.js"
          test -f "$package/dist/browser/autogenerated/wasm-bindgen/index_bg.wasm"
          node -e "const p=require('./spikes/relay-corecrypto/node_modules/@wireapp/core-crypto/package.json'); if(p.version!=='10.5.3') process.exit(1)"
          mkdir -p assets/relay-crypto
          cp "$package/dist/browser/corecrypto.js" assets/relay-crypto/corecrypto.js
          cp "$package/dist/browser/autogenerated/wasm-bindgen/index_bg.wasm" assets/relay-crypto/index_bg.wasm
          sha256sum assets/relay-crypto/corecrypto.js assets/relay-crypto/index_bg.wasm > assets/relay-crypto/SHA256SUMS
      - name: Commit exact generated files to the review branch
        run: |
          set -eu
          git add assets/relay-crypto/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor pinned Wire CoreCrypto browser runtime for UNI-7 lab"
          git push origin HEAD:integration/relay-uni7-live-client-20260927
