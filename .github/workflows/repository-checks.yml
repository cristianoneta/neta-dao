name: Repository checks
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      source: ${{ steps.scope.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs
  general:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm ci --prefix faucet --ignore-scripts
      - run: npm run verify
      - run: python3 scripts/dependency-inventory.py
      - name: Retain dependency and WASM artifact inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-inventory
          path: dist/dependency-inventory.json
          if-no-files-found: error
      - run: node scripts/check-backend-deployment.mjs
      - run: docker build --tag cosmoot-backend-ci --file faucet/Dockerfile .
      - name: Verify image maintenance without network, keys or production state
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 512m --pids-limit 64
          --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777
          -v "$PWD/faucet/test/maintenance.test.mjs:/app/faucet/test/maintenance.test.mjs:ro"
          cosmoot-backend-ci node --test faucet/test/maintenance.test.mjs
      - run: node scripts/build-pages.mjs
      - run: npx --yes --package=wrangler@4.148.0 -c 'node scripts/check-pages-runtime.mjs'
  infrastructure_backup:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and verify pinned Restic (synthetic local repositories only)
        run: |
          curl --fail --location --retry 3 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 --output "$RUNNER_TEMP/restic.bz2"
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  $RUNNER_TEMP/restic.bz2" | sha256sum --check
          bzip2 --decompress --stdout "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic"
          echo "20d4142678d0d95ec11a4759def1b73fd9190abc9ca19e4b62d067c0b387e639  $RUNNER_TEMP/restic" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/restic"
      - name: Verify SQLite WAL exports, encrypted download and failure handling
        run: RESTIC_BINARY="$RUNNER_TEMP/restic" python3 -m unittest discover -s tests -p test_infrastructure_backup.py -v
  contracts:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    uses: ./.github/workflows/contract-ci.yml
  programme_execution:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix faucet --ignore-scripts
      - name: Download the pinned Juno runtime
        run: |
          curl --fail --location --retry 3 https://github.com/CosmosContracts/juno/releases/download/v31.0.0/junod --output "$RUNNER_TEMP/junod"
          echo "46fddb2c8c3fadcded48c63f72d88e9452cfd8a1da282892878a9f05d47f873c  $RUNNER_TEMP/junod" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/junod"
      - name: Execute original and corrected claims through local Juno governance
        run: node scripts/check-programme-execution.mjs "$RUNNER_TEMP/junod"
  wasm:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    uses: ./.github/workflows/build-testnet-wasm.yml
  browser:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    uses: ./.github/workflows/relay-crypto-browser.yml
  faucet:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    uses: ./.github/workflows/faucet-ci.yml
  backup:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    uses: ./.github/workflows/relay-backup-ci.yml
  names:
    needs: scope
    if: needs.scope.outputs.source == 'true'
    uses: ./.github/workflows/nns-quote-ci.yml
  required:
    name: Required repository checks
    if: always()
    needs: [scope, general, infrastructure_backup, contracts, programme_execution, wasm, browser, faucet, backup, names]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const {scope, ...jobs} = JSON.parse(process.env.RESULTS);
          const source = scope.outputs.source;
          if (scope.result !== 'success' || !['true', 'false'].includes(source)) process.exit(1);
          const expected = source === 'true' ? 'success' : 'skipped';
          if (Object.values(jobs).some(job => job.result !== expected)) process.exit(1);
          NODE
