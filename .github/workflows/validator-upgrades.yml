name: Validator upgrade history
on:
  push:
    branches: [main]
    paths: ['scripts/update_validator_upgrades.py', 'data/community-upgrades.json', '.github/workflows/validator-upgrades.yml']
  pull_request:
    paths: ['scripts/update_validator_upgrades.py', 'tests/test_validator_upgrades.py', 'data/community-upgrades.json', '.github/workflows/validator-upgrades.yml']
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validator-upgrade-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_validator_upgrades.py
  collect:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # Refresh late arrivals every ten minutes; keep a bounded catch-up margin.
      - run: python scripts/update_validator_upgrades.py --seconds 120 --max-blocks 1000
      - name: Publish only collected upgrade history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/validator-upgrades/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update validator upgrade history"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
