name: Build contract WASM

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.list.outputs.contracts }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: list
        run: echo "contracts=$(node -p 'JSON.stringify(require("./scripts/contracts.json"))')" >> "$GITHUB_OUTPUT"
  build:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        contract: ${{ fromJSON(needs.inventory.outputs.contracts) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build release WASM
        run: bash scripts/build-wasm.sh "${{ matrix.contract }}"
      - name: Validate CosmWasm artifact
        run: |
          cargo install cosmwasm-check --version 1.5.11 --locked
          cosmwasm-check contracts/${{ matrix.contract }}/target/wasm32-unknown-unknown/release/*.wasm
      - name: Verify shipped Names artifact
        if: matrix.contract == 'neta-names-v2' || matrix.contract == 'neta-names-test-token' || matrix.contract == 'neta-validator-profiles'
        run: |
          artifact="${{ matrix.contract }}"
          file="${artifact//-/_}.wasm"
          shipped="assets/names-testnet/${file}"
          if [ "$artifact" = neta-names-v2 ]; then shipped="assets/names-mainnet/neta_names_v2_v031.wasm"; fi
          cmp "contracts/${artifact}/target/wasm32-unknown-unknown/release/${file}" "$shipped"
      - name: Verify shipped personal mailbox artifact
        if: matrix.contract == 'neta-relay-mailbox'
        run: cmp contracts/neta-relay-mailbox/target/wasm32-unknown-unknown/release/neta_relay_mailbox.wasm assets/relay-mainnet/neta_relay_mailbox_v04.wasm
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp contracts/${{ matrix.contract }}/target/wasm32-unknown-unknown/release/*.wasm artifacts/
          sha256sum artifacts/*.wasm > artifacts/SHA256SUMS.txt
      - name: Verify shipped workshop artifact
        if: matrix.contract == 'neta-proposal-workshop'
        run: |
          expected="$(cut -d ' ' -f 1 assets/neta_proposal_workshop.sha256)"
          actual="$(sha256sum artifacts/neta_proposal_workshop.wasm | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          cmp artifacts/neta_proposal_workshop.wasm assets/neta_proposal_workshop.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.contract }}-wasm
          path: artifacts/
          if-no-files-found: error
