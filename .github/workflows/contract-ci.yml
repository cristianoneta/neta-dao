name: Contract and frontend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'contracts/**/Cargo.lock') }}
      - name: Format
        run: node scripts/check-contracts.mjs fmt
      - name: Test
        run: node scripts/check-contracts.mjs test
      - name: Clippy
        run: node scripts/check-contracts.mjs clippy
      - name: Reproduce reviewed mainnet Names artifact
        run: |
          bash scripts/build-wasm.sh neta-names-v2
          cmp contracts/neta-names-v2/target/wasm32-unknown-unknown/release/neta_names_v2.wasm assets/names-mainnet/neta_names_v2_v031.wasm
      - name: Frontend syntax and invariants
        run: |
          python scripts/build_dao_directory.py --check
          python -m unittest tests/test_dao_onboarding.py tests/test_members.py
          node --test tests/*.test.mjs
          node --check relay-testnet-setup.js
          node --check relay-uni7-readiness.js
          python -m unittest tests/test_delegation_treasury.py tests/test_treasury_events.py tests/test_treasury_history.py tests/test_treasury_accounting.py tests/test_treasury_receipts.py tests/test_generic_accounting.py tests/test_community_blocks.py tests/test_staking_accrual.py
      - name: Cache pinned audit binary
        id: audit-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-tools/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.1-rust-1.85.1
      - name: Install pinned audit binary
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 install cargo-audit --version 0.22.1 --locked --root .ci-tools/cargo-audit
      - name: Dependency audit
        run: |
          test "$(.ci-tools/cargo-audit/bin/cargo-audit --version)" = "cargo-audit 0.22.1"
          node scripts/check-contracts.mjs audit
