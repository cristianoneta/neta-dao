name: Contract and frontend CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - "neta-governance.js"
      - "ux-draft.js"
      - "treasury.js"
      - "relay.js"
      - "relay.css"
      - "names.css"
      - "names.js"
      - "scripts/update_treasury.py"
      - "scripts/update_treasury_events.py"
      - "tests/test_treasury_events.py"
      - "tests/test_treasury_history.py"
      - "tests/frontend-smoke.test.mjs"
      - "data/treasury/**"
      - "index.html"
      - "docs/RELAY_SECURITY_ARCHITECTURE.md"
      - "assets/neta_proposal_workshop.sha256"
      - "rust-toolchain.toml"
      - ".github/workflows/contract-ci.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "neta-governance.js"
      - "ux-draft.js"
      - "treasury.js"
      - "relay.js"
      - "relay.css"
      - "names.css"
      - "names.js"
      - "scripts/update_treasury.py"
      - "scripts/update_treasury_events.py"
      - "tests/test_treasury_events.py"
      - "tests/test_treasury_history.py"
      - "tests/frontend-smoke.test.mjs"
      - "data/treasury/**"
      - "index.html"
      - "docs/RELAY_SECURITY_ARCHITECTURE.md"
      - "assets/neta_proposal_workshop.sha256"
      - "rust-toolchain.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: |
          cargo fmt --manifest-path contracts/neta-proposal-workshop/Cargo.toml --check
          cargo fmt --manifest-path contracts/workshop-access-mock/Cargo.toml --check
          cargo fmt --manifest-path contracts/neta-names/Cargo.toml
      - name: Test
        run: |
          cargo test --locked --manifest-path contracts/neta-proposal-workshop/Cargo.toml
          cargo test --locked --manifest-path contracts/workshop-access-mock/Cargo.toml
          cargo test --locked --manifest-path contracts/neta-names/Cargo.toml
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --manifest-path contracts/neta-proposal-workshop/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path contracts/workshop-access-mock/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path contracts/neta-names/Cargo.toml -- -D warnings
      - name: Frontend syntax and invariants
        run: |
          node --test tests/frontend-smoke.test.mjs
          python -m unittest tests/test_treasury_events.py tests/test_treasury_history.py
      - name: Dependency audit
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 install cargo-audit --version 0.22.1 --locked
          # CosmWasm 1.5.11 pulls curve25519-dalek only for host-side crypto.
          # The affected subtraction is not compiled into these Wasm artifacts.
          # Keep this explicit compatibility exception until Juno supports the
          # CosmWasm line that upgrades curve25519-dalek.
          cargo +1.85.1 audit --file contracts/neta-proposal-workshop/Cargo.lock --ignore RUSTSEC-2024-0344
          cargo +1.85.1 audit --file contracts/workshop-access-mock/Cargo.lock --ignore RUSTSEC-2024-0344
