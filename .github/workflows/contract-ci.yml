  pull_request:
    paths:
      - "contracts/**"
      - "neta-governance.js"
      - "ux-draft.js"
      - "treasury.js"
      - "treasury-pnl*.mjs"
      - "scripts/update_treasury_accounting.py"
      - "tests/test_treasury_accounting.py"
      - "relay.js"
      - "relay-mailbox-status.js"
      - "relay-testnet-setup.js"
      - "relay-testnet-setup.html"
      - "relay-uni7-readiness.js"
      - "relay-uni7-client.mjs"
      - "tests/relay-uni7-client.test.mjs"
      - "relay-uni7-readiness.html"
      - "tests/relay-uni7-readiness.test.mjs"
      - "relay-testnet-setup.css"
      - "relay.css"
      - "names.css"
      - "names.js"
      - "names-workspace.js"
      - "names-profile*.mjs"
      - "names-v2*.mjs"
      - "names-v2*.html"
      - "assets/names-testnet/**"
      - "assets/names-mainnet/**"
      - "names/**"
      - "tests/fixtures/**"
      - "dao-directory.js"
      - "dao-members.js"
      - "data/dao-directory.json"
      - "scripts/build_dao_directory.py"
      - "scripts/update_dao_directory.py"
      - "scripts/update_members.py"
      - "tests/test_members.py"
      - ".github/workflows/members-snapshot.yml"
      - "scripts/update_main_dao.py"
      - ".github/workflows/main-dao-snapshot.yml"
      - "tests/test_dao_onboarding.py"
      - "scripts/update_treasury.py"
      - "scripts/update_treasury_events.py"
      - "tests/test_treasury_events.py"
      - "tests/test_treasury_history.py"
      - "tests/*.test.mjs"
      - "tests/relay-mailbox-status.test.mjs"
      - "data/treasury/**"
      - "index.html"
      - "*.css"
      - "assets/design/**"
      - "docs/design/responsive-preview.html"
      - "docs/RELAY_SECURITY_ARCHITECTURE.md"
      - "assets/neta_proposal_workshop.sha256"
      - "rust-toolchain.toml"
      - ".github/workflows/contract-ci.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "neta-governance.js"
      - "ux-draft.js"
      - "treasury.js"
      - "treasury-pnl*.mjs"
      - "scripts/update_treasury_accounting.py"
      - "tests/test_treasury_accounting.py"
      - "relay.js"
      - "relay-mailbox-status.js"
      - "relay-testnet-setup.js"
      - "relay-testnet-setup.html"
      - "relay-uni7-readiness.js"
      - "relay-uni7-client.mjs"
      - "tests/relay-uni7-client.test.mjs"
      - "relay-uni7-readiness.html"
      - "tests/relay-uni7-readiness.test.mjs"
      - "relay-testnet-setup.css"
      - "relay.css"
      - "names.css"
      - "names.js"
      - "names-workspace.js"
      - "names-profile*.mjs"
      - "names-v2*.mjs"
      - "names-v2*.html"
      - "assets/names-testnet/**"
      - "assets/names-mainnet/**"
      - "names/**"
      - "tests/fixtures/**"
      - "dao-directory.js"
      - "dao-members.js"
      - "data/dao-directory.json"
      - "scripts/build_dao_directory.py"
      - "scripts/update_dao_directory.py"
      - "scripts/update_members.py"
      - "tests/test_members.py"
      - ".github/workflows/members-snapshot.yml"
      - "scripts/update_main_dao.py"
      - ".github/workflows/main-dao-snapshot.yml"
      - "tests/test_dao_onboarding.py"
      - "scripts/update_treasury.py"
      - "scripts/update_treasury_events.py"
      - "tests/test_treasury_events.py"
      - "tests/test_treasury_history.py"
      - "tests/*.test.mjs"
      - "tests/relay-mailbox-status.test.mjs"
      - "data/treasury/**"
      - "index.html"
      - "*.css"
      - "assets/design/**"
      - "docs/design/responsive-preview.html"
      - "docs/RELAY_SECURITY_ARCHITECTURE.md"
      - "assets/neta_proposal_workshop.sha256"
      - "rust-toolchain.toml"
      - ".github/workflows/contract-ci.yml"

permissions:
  contents: read

concurrency:
  group: contract-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'contracts/**/Cargo.lock') }}
      - name: Format
        run: |
          cargo fmt --manifest-path contracts/neta-proposal-workshop/Cargo.toml --check
          cargo fmt --manifest-path contracts/workshop-access-mock/Cargo.toml --check
          cargo fmt --manifest-path contracts/neta-names/Cargo.toml --check
          cargo fmt --manifest-path contracts/neta-validator-profiles/Cargo.toml --check
          cargo fmt --manifest-path contracts/neta-names-v2/Cargo.toml --check
          cargo fmt --manifest-path contracts/neta-names-test-token/Cargo.toml --check
          cargo fmt --manifest-path contracts/neta-relay-mailbox/Cargo.toml --check
      - name: Test
        run: |
          cargo test --locked --manifest-path contracts/neta-proposal-workshop/Cargo.toml
          cargo test --locked --manifest-path contracts/workshop-access-mock/Cargo.toml
          cargo test --locked --manifest-path contracts/neta-names/Cargo.toml
          cargo test --locked --manifest-path contracts/neta-validator-profiles/Cargo.toml
          cargo test --locked --manifest-path contracts/neta-names-v2/Cargo.toml
          cargo test --locked --manifest-path contracts/neta-names-test-token/Cargo.toml
          cargo test --locked --manifest-path contracts/neta-relay-mailbox/Cargo.toml
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --manifest-path contracts/neta-proposal-workshop/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path contracts/workshop-access-mock/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path contracts/neta-names/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path contracts/neta-validator-profiles/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path contracts/neta-names-v2/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path contracts/neta-names-test-token/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path contracts/neta-relay-mailbox/Cargo.toml -- -D warnings
      - name: Reproduce reviewed mainnet Names artifact
        run: |
          bash scripts/build-wasm.sh neta-names-v2
          cmp contracts/neta-names-v2/target/wasm32-unknown-unknown/release/neta_names_v2.wasm assets/names-mainnet/neta_names_v2_v031.wasm
      - name: Frontend syntax and invariants
        run: |
          python scripts/build_dao_directory.py --check
          python -m unittest tests/test_dao_onboarding.py tests/test_members.py
          node --test tests/*.test.mjs
          node --check relay-testnet-setup.js
          node --check relay-uni7-readiness.js
          python -m unittest tests/test_treasury_events.py tests/test_treasury_history.py
      - name: Cache pinned audit binary
        id: audit-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-tools/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.1-rust-1.85.1
      - name: Install pinned audit binary
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 install cargo-audit --version 0.22.1 --locked --root .ci-tools/cargo-audit
      - name: Dependency audit
        run: |
          test "$(.ci-tools/cargo-audit/bin/cargo-audit --version)" = "cargo-audit 0.22.1"
          # CosmWasm 1.5.11 pulls curve25519-dalek only for host-side crypto.
          # The affected subtraction is not compiled into these Wasm artifacts.
          # Keep this explicit compatibility exception until Juno supports the
          # CosmWasm line that upgrades curve25519-dalek.
          .ci-tools/cargo-audit/bin/cargo-audit audit --file contracts/neta-proposal-workshop/Cargo.lock --ignore RUSTSEC-2024-0344
          .ci-tools/cargo-audit/bin/cargo-audit audit --file contracts/workshop-access-mock/Cargo.lock --ignore RUSTSEC-2024-0344
          .ci-tools/cargo-audit/bin/cargo-audit audit --file contracts/neta-names/Cargo.lock --ignore RUSTSEC-2024-0344
          .ci-tools/cargo-audit/bin/cargo-audit audit --file contracts/neta-validator-profiles/Cargo.lock --ignore RUSTSEC-2024-0344
          .ci-tools/cargo-audit/bin/cargo-audit audit --file contracts/neta-names-v2/Cargo.lock --ignore RUSTSEC-2024-0344
          .ci-tools/cargo-audit/bin/cargo-audit audit --file contracts/neta-names-test-token/Cargo.lock --ignore RUSTSEC-2024-0344
          .ci-tools/cargo-audit/bin/cargo-audit audit --file contracts/neta-relay-mailbox/Cargo.lock --ignore RUSTSEC-2024-0344



