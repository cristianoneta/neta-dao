name: Main DAO snapshots
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_main_dao.py'
      - 'scripts/update_treasury_accounting.py'
      - 'scripts/update_treasury.py'
      - 'scripts/update_treasury_events.py'
      - 'data/dao-directory.json'
      - 'data/treasury/token-registry.json'
      - '.github/workflows/main-dao-snapshot.yml'
      - 'names/publish-snapshot.mjs'
      - 'docs/deployments/nns-mainnet.json'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-dao-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collect isolated main DAO sources with bounded timeouts
        env:
          TREASURY_DAILY_SNAPSHOT: auto
        run: python scripts/update_main_dao.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Publish shared NNS price when configured
        # Only the trusted main workflow receives the price authority; never PRs.
        if: github.ref == 'refs/heads/main'
        env:
          NNS_PRICE_SIGNING_KEY: ${{ secrets.NNS_PRICE_SIGNING_KEY }}
        shell: bash
        run: |
          if [ ! -f docs/deployments/nns-mainnet.json ]; then
            echo 'NNS mainnet not configured; retaining any previous price.'
          elif [ -z "$NNS_PRICE_SIGNING_KEY" ]; then
            echo '::error::NNS price secret missing; retaining any previous price.'
            exit 1
          else
            node names/publish-snapshot.mjs data/treasury/neta-main.json docs/deployments/nns-mainnet.json data/nns/price.json
          fi
      - name: Publish main DAO snapshots and source status
        if: ${{ !cancelled() }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/daos/neta-status.json data/treasury/neta-main*.json
          if [ -f data/nns/price.json ]; then git add data/nns/price.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update main DAO snapshots"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
          done
