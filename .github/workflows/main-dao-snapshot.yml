name: Main DAO snapshots
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_main_dao.py'
      - 'scripts/update_treasury.py'
      - 'scripts/update_treasury_events.py'
      - 'data/dao-directory.json'
      - 'data/treasury/token-registry.json'
      - '.github/workflows/main-dao-snapshot.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-dao-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collect isolated main DAO sources with bounded timeouts
        env:
          TREASURY_DAILY_SNAPSHOT: auto
        run: python scripts/update_main_dao.py
      - name: Publish main DAO snapshots and source status
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/daos/neta-status.json data/treasury/neta-main*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update main DAO snapshots"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
          done
