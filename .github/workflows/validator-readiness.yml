name: Pre-restart validator votes
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/observe_validator_readiness.mjs', 'juno-upgrade-readiness.mjs', 'tests/juno-upgrade-readiness.test.mjs', 'data/validator-upgrades/*-readiness.json', '.github/workflows/validator-readiness.yml']
permissions:
  contents: read
concurrency:
  group: validator-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/juno-upgrade-readiness.test.mjs
  observe:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/observe_validator_readiness.mjs
      - name: Publish captured votes only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/validator-upgrades/*-readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record pre-restart validator votes"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
