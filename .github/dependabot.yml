# Owner decision: manual version-update batches; retain security alerts and updates.
# Zero pauses version PRs only. No automated version-maintenance PR waves.
version: 2
updates:
  - package-ecosystem: npm
    directory: /faucet
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
